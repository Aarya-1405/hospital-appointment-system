name: Hospital Appointment System CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check all source files
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend - install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Build
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

  docker:
    name: Docker - build, deploy and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/departments > /dev/null; then
              echo "API is up"; exit 0
            fi
            echo "Waiting for API... ($i/30)"; sleep 3
          done
          echo "API did not become ready"; exit 1

      - name: Seed the database
        run: docker compose exec -T server npm run seed

      - name: Smoke test - doctors endpoint
        run: curl -f http://localhost:5000/api/doctors

      - name: Smoke test - login returns a token
        run: |
          curl -fs -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@aarogya.example","password":"Admin@123"}' | grep -qi token

      - name: Smoke test - frontend is served
        run: curl -f http://localhost:5173

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
