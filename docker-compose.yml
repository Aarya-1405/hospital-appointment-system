services:
  mongo:
    image: mongo:7
    container_name: hospital-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [hospital-net]

 server:
    build: ./server
    image: hospital-server:latest
    container_name: hospital-server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/hospital_appointments
      JWT_SECRET: ${JWT_SECRET:-default_ci_jwt_secret_key_12345}
      JWT_EXPIRES: 1d

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    image: hospital-client:latest
    container_name: hospital-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on: [server]
    networks: [hospital-net]

volumes:
  mongo-data:

networks:
  hospital-net:
    name: hospital-net
